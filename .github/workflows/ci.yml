name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and lint
        run: ./gradlew --no-daemon test lint
      - name: Build the app (with the TV helper and home screen)
        run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRemoTV-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and sign
        env:
          OPENREMOTV_KEYSTORE_BASE64: ${{ secrets.OPENREMOTV_KEYSTORE_BASE64 }}
          OPENREMOTV_KEYSTORE_PASSWORD: ${{ secrets.OPENREMOTV_KEYSTORE_PASSWORD }}
          OPENREMOTV_KEY_ALIAS: ${{ secrets.OPENREMOTV_KEY_ALIAS }}
          OPENREMOTV_KEY_PASSWORD: ${{ secrets.OPENREMOTV_KEY_PASSWORD }}
        run: |
          echo "$OPENREMOTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export OPENREMOTV_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "OpenRemoTV-${GITHUB_REF_NAME#v}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '$0 ~ "^## "v {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "OpenRemoTV-$version.apk" --title "OpenRemoTV $version" --notes "$notes"
